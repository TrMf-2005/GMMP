<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entreprises - Département de Génie Mecanique & productique</title>
<style>
/* ================= HEADER ================= */
header  {
  background: rgba(76, 175, 80, 0.8);
  color: white;
  padding: 15px 30px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 0 0 15px 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
footer {
  background: rgba(76, 175, 80, 0.8);
  color: white;
  padding: 15px 30px;
  margin-top: 50px;
  border-radius: 0 0 15px 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  text-align: center;
}
.logo h1 { margin: 0; font-size: 28px; font-family: 'Segoe UI', sans-serif; }
nav ul { list-style: none; display: flex; margin: 0; padding: 0; }
nav ul li { margin-left: 25px; }
nav ul li a { color: white; text-decoration: none; font-weight: 600; font-size: 16px; }
nav ul li a:hover { color: #FFD700; }

/* Profil admin */
.profile-icon {
  width: 35px; height: 35px; border-radius: 50%;
  background: url('https://cdn-icons-png.flaticon.com/512/3135/3135715.png') no-repeat center center;
  background-size: cover;
  cursor: pointer;
  margin-left: 20px;
}
 button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
      margin-bottom: 50px;
    }

    button:hover {
      background-color: #45a049;
    }
/* ================= BODY ================= */
body { 
  margin: 0; 
  font-family: Arial, sans-serif; 
  background-image: url("interface.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.content { 
  max-width: 1200px; 
  margin: 50px auto; 
  padding: 20px; 
}

/* ================= SEARCH ================= */
.search-box { text-align: center; margin-bottom: 30px; }
.search-box input, .search-box select {
  padding: 10px 15px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-right: 10px;
}

/* ================= BLOCS ENTREPRISE ================= */
#entreprisesContainer {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}
.entreprise {
  background: white;
  border-radius: 10px;
  padding: 20px;
  width: 250px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.entreprise h3 { margin-top: 0; color: #4CAF50; font-size: 20px; }
.entreprise p { margin: 5px 0; color: #333; }
.entreprise button { margin-top: 10px; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
.entreprise button:hover { background-color: #45a049; }
.entreprise .admin-btn { background: #FF9800; }
.entreprise .admin-btn:hover { background: #FB8C00; }

/* ================= BLOC ERREUR ================= */
.no-result { background: #f44336; color: white; border-radius: 10px; padding: 20px; text-align: center; font-weight: bold; width: 300px; }

/* ================= MODAL ADMIN ================= */
.modal {
  display: none;
  position: fixed;
  z-index: 200;
  left: 0; top: 0;
  width: 100%; height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 400px;
}
.modal-content input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
.modal-content button { margin-top: 10px; width: 100%; padding: 10px; border-radius: 5px; border: none; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
.modal-content button:hover { background: #45a049; }

/* ================= RESPONSIVE ================= */
@media (max-width:768px){
  .entreprise { width: 80%; }
  .search-box input { width: 60%; margin-bottom: 10px; }
  .search-box select { width: 35%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>INSTI-LOKOSSA</h1>
    <h2>Entreprises - Département de Génie Mécanique & productique</h2>
  </div>
  <div style="display:flex; align-items:center;">
    <nav>
      <ul>
        <li><a href="https://hhhgvcfdxseuygfrgnnnnnnbbvcclieuxcghvbghdfggfsdfgesdhsdzsdgdfgg.vercel.app/">Accueil</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="A_propos.html">A propos</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="content">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Rechercher une entreprise...">
    <select id="searchType">
      <option value="name">Nom</option>
      <option value="city">Ville</option>
    </select>
  </div>

  <div id="entreprisesContainer">
    <!-- Les entreprises seront injectées ici via JS -->
  </div>
</div>
<center>
  <a href="#"><button>Aller au debut</button></a>

</center>
<!-- MODAL ADMIN -->
<div id="adminModal" class="modal">
  <div class="modal-content">
    <h3>Admin : Ajouter / Modifier Entreprise</h3>
    <input type="text" id="companyName" placeholder="Nom de l'entreprise">
    <input type="text" id="contactName" placeholder="Nom du contact">
    <input type="text" id="phone" placeholder="Téléphone">
    <input type="text" id="city" placeholder="Ville">
    <button id="addBtn" onclick="addEntrepriseAdmin()">Ajouter Entreprise</button>
    <button id="closeBtn" onclick="closeAdmin()">Déconnecter</button>
    <button id="toggleEditBtn" onclick="toggleEditMode()">Fermer</button>
  </div>
</div>

  <footer>
  <p style="text-align: center; padding: 20px; background: rgba(0,0,0,0.1); margin-top: 50px;">
    &copy; 2026 INSTI-LOKOSSA. Tous droits réservés.
  </p>
  <center>
    <strong>
      <em>
        TWO TF's Codes
               <div class="profile-icon" 
    title="Espace administrateur" 
    onclick="adminLogin()"
    style="margin-top: 10px;"></div>
      </em>
      <em>
        <strong>
          Web Art and TWO TF's Codes
        </strong>
      </em>
    </strong>
  </center>
   </footer>

<script>
// ================= CONFIGURATION =================
// ⚠️ Remplace cette URL par celle de TON service Render si elle change un jour
const API_URL = "https://insti-backend-k8ob.onrender.com/api/entreprises";

// ⚠️ Ce slug est DIFFÉRENT sur chacune des 5 pages !
// genie-civil | genie-mecanique | maintenance-systemes | genie-energetique | genie-electrique-informatique
const DEPARTEMENT = "genie-mecanique";

// ================= ETAT GLOBAL =================
let isAdmin = false;       // admin connecté ?
let editMode = false;      // mode édition actif ?
let adminPassword = null;  // mot de passe saisi, envoyé à chaque requête protégée
let entreprises = [];      // liste en mémoire, reçue depuis l'API

// ================= CHARGEMENT DEPUIS L'API =================
async function loadEntreprises() {
  try {
    const response = await fetch(`${API_URL}/${DEPARTEMENT}`);
    if (!response.ok) throw new Error('Erreur lors du chargement');
    entreprises = await response.json();
    renderEntreprises();
  } catch (err) {
    console.error("Erreur chargement API:", err);
    alert("Impossible de charger les entreprises. Réessaie dans quelques instants (le serveur démarre parfois lentement).");
  }
}

document.addEventListener("DOMContentLoaded", loadEntreprises);

// ================= ADMIN : CONNEXION =================
function adminLogin() {
  if (!isAdmin) {
    const pwd = prompt("Mot de passe administrateur :");
    if (pwd === null) return; // annulé
    adminPassword = pwd;
    isAdmin = true; // on suppose correct pour l'instant, vérifié au premier appel réel
    editMode = false;
    document.getElementById('adminModal').style.display = 'flex';
    renderEntreprises();
  } else {
    document.getElementById('adminModal').style.display = 'flex';
  }
}

function toggleEditMode() {
  if (!isAdmin) return;
  editMode = !editMode;
  document.getElementById('adminModal').style.display = 'none';
  renderEntreprises();
}

function closeAdmin() {
  isAdmin = false;
  editMode = false;
  adminPassword = null;
  document.getElementById('adminModal').style.display = 'none';
  renderEntreprises();
}

// Gère une réponse 401/403 : mot de passe refusé par le serveur
function gererErreurAuth(status) {
  if (status === 401 || status === 403) {
    alert("Mot de passe administrateur incorrect.");
    closeAdmin();
    return true;
  }
  return false;
}

// ================= ADMIN : AJOUTER =================
async function addEntrepriseAdmin() {
  if (!isAdmin) return alert("Vous devez être admin !");

  const nom = document.getElementById('companyName').value.trim();
  const contact = document.getElementById('contactName').value.trim();
  const telephone = document.getElementById('phone').value.trim();
  const ville = document.getElementById('city').value.trim();

  if (!nom || !ville) return alert("Le nom et la ville sont obligatoires !");

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-password': adminPassword
      },
      body: JSON.stringify({ nom, ville, contact, telephone, departement: DEPARTEMENT })
    });

    if (gererErreurAuth(response.status)) return;
    if (!response.ok) throw new Error('Erreur lors de l\'ajout');

    const nouvelleEntreprise = await response.json();
    entreprises.unshift(nouvelleEntreprise);
    renderEntreprises();

    document.getElementById('companyName').value = '';
    document.getElementById('contactName').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('city').value = '';
  } catch (err) {
    console.error(err);
    alert("Erreur lors de l'ajout de l'entreprise.");
  }
}

// ================= ADMIN : SUPPRIMER =================
async function deleteEntreprise(id) {
  if (!isAdmin || !editMode) return;
  if (!confirm("Supprimer cette entreprise ?")) return;

  try {
    const response = await fetch(`${API_URL}/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-password': adminPassword }
    });

    if (gererErreurAuth(response.status)) return;
    if (!response.ok) throw new Error('Erreur lors de la suppression');

    entreprises = entreprises.filter(e => e._id !== id);
    renderEntreprises();
  } catch (err) {
    console.error(err);
    alert("Erreur lors de la suppression.");
  }
}

// ================= ADMIN : MODIFIER =================
async function editEntreprise(id) {
  if (!isAdmin || !editMode) return;
  const e = entreprises.find(ent => ent._id === id);
  if (!e) return;

  const nom = prompt("Nom de l'entreprise :", e.nom);
  if (nom === null) return;
  const contact = prompt("Nom du contact :", e.contact || '');
  const telephone = prompt("Téléphone :", e.telephone || '');
  const ville = prompt("Ville :", e.ville);

  if (!nom || !ville) return alert("Le nom et la ville sont obligatoires !");

  try {
    const response = await fetch(`${API_URL}/${id}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-password': adminPassword
      },
      body: JSON.stringify({ nom, ville, contact, telephone })
    });

    if (gererErreurAuth(response.status)) return;
    if (!response.ok) throw new Error('Erreur lors de la modification');

    const entrepriseModifiee = await response.json();
    entreprises = entreprises.map(ent => ent._id === id ? entrepriseModifiee : ent);
    renderEntreprises();
  } catch (err) {
    console.error(err);
    alert("Erreur lors de la modification.");
  }
}

// ================= AFFICHAGE =================
function renderEntreprises() {
  const container = document.getElementById('entreprisesContainer');
  container.innerHTML = '';

  let filtered = entreprises;

  const input = document.getElementById('searchInput').value.toLowerCase();
  const type = document.getElementById('searchType').value;
  if (input) {
    filtered = entreprises.filter(ent => {
      if (type === 'name') return ent.nom.toLowerCase().includes(input);
      if (type === 'city') return ent.ville.toLowerCase().includes(input);
      return true;
    });
  }

  if (filtered.length === 0) {
    const div = document.createElement('div');
    div.className = 'no-result';
    div.innerText = 'Entreprise non classée pour votre département';
    container.appendChild(div);
    return;
  }

  filtered.forEach(e => {
    const div = document.createElement('div');
    div.className = 'entreprise';
    div.innerHTML = `
      <h3>${e.nom}</h3>
      ${e.contact ? `<p><strong>Contact :</strong> ${e.contact}</p>` : ''}
      ${e.telephone ? `<p><strong>Téléphone :</strong> ${e.telephone}</p>` : ''}
      <p><strong>Ville :</strong> ${e.ville}</p>
      ${e.telephone ? `<button onclick="appeler('${e.telephone}')">Joindre</button>` : ''}
      ${isAdmin && editMode ? `
        <button class="admin-btn" onclick="editEntreprise('${e._id}')">Modifier</button>
        <button class="admin-btn" onclick="deleteEntreprise('${e._id}')">Supprimer</button>
      ` : ''}
    `;
    container.appendChild(div);
  });
}

function appeler(numero) {
  window.location.href = "tel:" + numero;
}

// ================= RECHERCHE =================
document.getElementById('searchInput').addEventListener('keyup', renderEntreprises);
document.getElementById('searchType').addEventListener('change', renderEntreprises);
  


</script>
</body>
</html>
